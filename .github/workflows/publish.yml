name: "📦 Publish Python Package / Publicar Paquete Python"

on:
  push:
    tags:
      - 'v*'  # Publica solo en versiones etiquetadas v1.0.1, v2.0.0, etc.

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: 📦 Build and Publish
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v6

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: "📦 Install build tool"
        run: python -m pip install --upgrade build

      - name: "🛠️ Build package"
        run: python -m build

      - name: "🚀 Publish to PyPI (recommended)"
        uses: pypa/gh-action-pypi-publish@c9e417052b7e43bc85ec35795ea4536d582c1c04

        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
